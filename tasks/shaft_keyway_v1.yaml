task_id: shaft_keyway_v1
title: "Cylindrical shaft with a keyway slot"
description_template: >
  Design a cylindrical shaft, diameter {{ shaft_diameter }}mm, length
  {{ shaft_length }}mm. Cut a keyway slot into the shaft surface, parallel
  to the shaft axis: width {{ key_width }}mm, depth {{ key_depth }}mm
  (measured radially inward from the shaft's outer surface), length
  {{ key_length }}mm, starting {{ key_start_offset }}mm from one end.
  Export as a single manifold solid STEP file. Units: millimeters.

variables:
  shaft_diameter:   { type: float, default: 20.0, unit: mm }
  shaft_length:     { type: float, default: 100.0, unit: mm }
  key_width:        { type: float, default: 6.0, unit: mm }
  key_depth:        { type: float, default: 3.0, unit: mm }
  key_length:       { type: float, default: 30.0, unit: mm }
  key_start_offset: { type: float, default: 10.0, unit: mm }

assertions:
  - id: is_manifold_solid
    type: manifold_solid
    description: "Exactly one closed, manifold, watertight solid body"
    params:
      min_solid_count: 1
      max_solid_count: 1

  - id: overall_envelope
    type: bounding_box
    description: "Overall envelope matches shaft diameter and length"
    params:
      expected:
        x: "{{ shaft_diameter }}"
        y: "{{ shaft_diameter }}"
        z: "{{ shaft_length }}"
      tolerance: 0.3

  - id: keyway
    type: keyway_slot
    description: "Keyway slot geometry and position"
    params:
      width: "{{ key_width }}"
      width_tol: 0.15
      depth: "{{ key_depth }}"
      depth_tol: 0.15
      length: "{{ key_length }}"
      length_tol: 0.3
      shaft_diameter: "{{ shaft_diameter }}"
      position_along_axis_from_end: "{{ key_start_offset }}"
      position_tol: 0.5

  - id: volume_check
    type: volume
    description: "Solid volume within 2% of analytically expected volume"
    params:
      expected: "{{ 3.14159265 * (shaft_diameter / 2) ** 2 * shaft_length - key_width * key_depth * key_length }}"
      tolerance_pct: 2.0

parametric:
  perturbable:
    - variable: key_width
      deltas:
        - { op: add, value: 2.0 }
    - variable: shaft_length
      deltas:
        - { op: scale, factor: 1.3 }
    - variable: key_length
      deltas:
        - { op: scale, factor: 0.5 }
